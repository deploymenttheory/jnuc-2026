name: Deploy presentations

# tools/ and package*.json no longer trigger a deploy: the Keynote and
# PowerPoint downloads are built on a Mac by hand (GitHub runners have no
# Keynote, and a Linux capture would render the decks in substitute fonts) and
# committed under presentations/, so a build-tool change on its own alters
# nothing live.
on:
  push:
    branches: [main]
    paths:
      - "presentations/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

# A sync plus an invalidation is not atomic, so never let two runs overlap.
# Queue instead of cancelling: a cancelled run can leave the bucket half-synced.
concurrency:
  group: deploy-presentations
  cancel-in-progress: false

# write, because the deploy pushes the live URL back into README.md.
permissions:
  contents: write

env:
  AWS_REGION: eu-west-2
  BUCKET: jl-html-presentation-2026
  DISTRIBUTION_ID: E2OOVHG9JBN54J

jobs:
  deploy:
    name: Sync to S3 and invalidate CloudFront
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # Ask the distribution for its own domain rather than hardcoding it, so a
      # replaced distribution only needs its ID updated in one place.
      - name: Resolve site URL
        id: site
        run: |
          domain="$(aws cloudfront get-distribution \
            --id "${DISTRIBUTION_ID}" \
            --query 'Distribution.DomainName' \
            --output text)"
          echo "url=https://${domain}" >> "$GITHUB_OUTPUT"

      # The bucket mirrors presentations/ exactly, so the URL layout is the repo
      # layout. _shared/ must ship: both decks load ../_shared/speakers.js.
      - name: Sync presentations to S3
        run: |
          aws s3 sync presentations/ "s3://${BUCKET}/" --delete \
            --exclude "*.md" \
            --exclude ".DS_Store"

      # The sync guesses MIME types from the extension and .key maps to
      # application/pgp-keys, so re-upload the deck downloads with the types
      # Keynote and PowerPoint files actually carry. .pptx is only correct on a
      # runner whose mime.types knows it, so it is set here rather than trusted.
      - name: Correct the download content types
        run: |
          aws s3 cp presentations/ "s3://${BUCKET}/" --recursive \
            --exclude "*" --include "*.key" \
            --content-type application/vnd.apple.keynote

          aws s3 cp presentations/ "s3://${BUCKET}/" --recursive \
            --exclude "*" --include "*.pptx" \
            --content-type application/vnd.openxmlformats-officedocument.presentationml.presentation

      # CachingOptimized holds objects at the edge for a day, so a sync alone
      # will not show up.
      - name: Invalidate CloudFront
        run: |
          id="$(aws cloudfront create-invalidation \
            --distribution-id "${DISTRIBUTION_ID}" \
            --paths '/*' \
            --query 'Invalidation.Id' \
            --output text)"
          echo "Invalidation ${id} created, waiting for it to complete"
          aws cloudfront wait invalidation-completed \
            --distribution-id "${DISTRIBUTION_ID}" \
            --id "${id}"

      # Only runs once the site is actually serving from that URL. A README-only
      # commit matches neither path filter, so this cannot retrigger the deploy.
      - name: Update the README link
        if: github.ref == 'refs/heads/main'
        env:
          SITE_URL: ${{ steps.site.outputs.url }}
        run: |
          sed -i -E "s#https://[A-Za-z0-9.-]+\.cloudfront\.net/?#${SITE_URL}/#g" README.md
          if git diff --quiet README.md; then
            echo "README already points at ${SITE_URL}"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Point README at ${SITE_URL}"
          # main can move between checkout and here via commits that skip this
          # workflow, so rebase rather than force the branch backwards.
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

      - name: Summarise
        env:
          url: ${{ steps.site.outputs.url }}
        run: |
          {
            echo "### Deployed"
            echo
            for deck in presentations/*/; do
              name="$(basename "$deck")"
              [ "$name" = "_shared" ] && continue
              echo "- [${name}](${url}/${name}/)"
            done
          } >> "$GITHUB_STEP_SUMMARY"
